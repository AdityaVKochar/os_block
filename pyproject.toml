[project]
name = "bscaf"
version = "0.1.0"
description = "Lightweight, tamper-evident system-call audit framework prototype"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
bscaf = "bscaf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
